<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Click Counter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="counter">
      <h1>My Click Counter</h1>
      <p>You have clicked the button:</p>
      <p class="count" id="count" aria-live="polite">0</p>
      <div class="buttons">
        <button id="count-button" type="button">Add one</button>
        <button id="reset-button" type="button" class="reset">Reset</button>
      </div>
    </main>
  </body>
</html>
